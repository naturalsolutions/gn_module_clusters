<div
  id="cover-spin"
  *ngIf="!searchService.dataLoaded"
>
  <div
    class="alert alert-warning"
    id="cover-message"
  >
    <span>Chargement des données en cours (cela peut prendre du temps)…</span>
  </div>
</div>

<div
  class="wrapper"
  data-qa="pnx-clusters"
>
  <nav
    id="sidebar"
    #navBar
    [(ngbCollapse)]="isSearchBarReduced"
  >
    <pnx-synthese-search (searchClicked)="onSearchEvent()"></pnx-synthese-search>
  </nav>

  <div class="row row-sm page-content">
    <button
      id="sidebarCollapse"
      class="btn btn-toogle-sidenav box-shadow"
      type="button"
      (click)="isSearchBarReduced = !isSearchBarReduced"
      [attr.aria-expanded]="!isSearchBarReduced"
    >
      <i
        [hidden]="isSearchBarReduced"
        class="fa fa-caret-left"
      ></i>
      <i
        [hidden]="!isSearchBarReduced"
        class="fa fa-caret-right"
      ></i>
    </button>
    <div class="col-sm-12 col-md-7 padding-sm">
      <pnx-synthese-carte
        [inputSyntheseData]="mapListService.geojsonData"
      ></pnx-synthese-carte>
    </div>
    <div class="col-sm-12 col-md-5 padding-sm">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeTab === 'observations'"
            (click)="activeTab = 'observations'"
          >
            Observations
            <span class="badge badge-secondary ml-1">{{ observationCountLabel }}</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeTab === 'clusters'"
            (click)="activeTab = 'clusters'"
          >
            Foyers
            <span class="badge badge-secondary ml-1">{{ clusters.length }}</span>
          </a>
        </li>
      </ul>
      <div class="tab-content pt-2">
        <div
          class="tab-pane"
          [class.active]="activeTab === 'observations'"
        >
          <pnx-clusters-obs-list
            [observations]="mapListService.tableData"
            [clusters]="clusters"
            [selectedObsIds]="selectedObsIds"
            [selectedObsRowId]="selectedObsRowId"
            [visible]="activeTab === 'observations'"
            (associateObservations)="onAssociateObservations($event)"
            (openInfoObs)="openInfoModal($event)"
            (selectObsOnMap)="onSelectObsOnMap($event)"
          ></pnx-clusters-obs-list>
        </div>
        <div
          class="tab-pane"
          [class.active]="activeTab === 'clusters'"
        >
          <pnx-clusters-list
            [clusters]="clusters"
            [selectedClusterId]="selectedClusterId"
            [clusterFilter]="clusterFilter"
            (clusterFilterChange)="clusterFilter = $event; updateWithClusterSwitch(); onSearchEvent()"
            (clusterClick)="onClusterClick($event)"
            (taxonClick)="onClusterTaxonClick($event)"
          ></pnx-clusters-list>
          <div class="actions-btns">
            <a
              mat-raised-button
              color="primary"
              class="btn-action uppercase"
              [routerLink]="['form']"
            >
              Créer un foyer
              <mat-icon>add_circle_outline</mat-icon>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
