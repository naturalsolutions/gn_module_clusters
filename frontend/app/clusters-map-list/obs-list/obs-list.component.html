<ngx-datatable
  #table
  class="material striped margin-top-xs table-size expandable"
  [rows]="observations"
  [columnMode]="'standard'"
  [scrollbarH]="true"
  [headerHeight]="50"
  [footerHeight]="50"
  [count]="observations.length"
  [limit]="rowNumber"
  [selected]="selectedRows"
  [selectionType]="'single'"
  [rowClass]="getRowClass"
  [reorderable]="true"
  sortType="multi"
  (activate)="onRowActivate($event)"
>
  <ngx-datatable-column [maxWidth]="40" [sortable]="false">
    <ng-template ngx-datatable-header-template>
      <input type="checkbox" [checked]="isAllSelected()" (change)="toggleAll()" (click)="$event.stopPropagation()" />
    </ng-template>
    <ng-template let-row="row" ngx-datatable-cell-template>
      <input
        type="checkbox"
        [checked]="isSelected(row['id_synthese'])"
        (change)="toggleSelection(row['id_synthese'])"
        (click)="$event.stopPropagation()"
      />
    </ng-template>
  </ngx-datatable-column>

  <ngx-datatable-column [maxWidth]="40" [sortable]="false">
    <ng-template let-row="row" ngx-datatable-cell-template>
      <a class="link-dark" (click)="onInfoObs(row['id_synthese'])">
        <i matTooltip="Détails de l'observation" class="fa fa-info-circle"></i>
      </a>
    </ng-template>
  </ngx-datatable-column>

  <ngx-datatable-column [maxWidth]="140" prop="date_min" name="Date" [sortable]="true">
    <ng-template let-row="row" ngx-datatable-cell-template>
      {{ padDate(row['date_min']) }}
    </ng-template>
  </ngx-datatable-column>

  <ngx-datatable-column prop="nom_vern_or_lb_nom" name="Taxon" [sortable]="true">
    <ng-template let-row="row" ngx-datatable-cell-template>
      <a style="color:#673ab7" (click)="taxonClick.emit(row['cd_nom']); $event.stopPropagation()" matTooltip="Filtrer avec ce taxon">
        {{ row['nom_vern_or_lb_nom'] }}
      </a>
    </ng-template>
  </ngx-datatable-column>

  <ngx-datatable-column prop="observers" name="Observateurs" [sortable]="true">
    <ng-template let-row="row" ngx-datatable-cell-template>
      <span [title]="row['observers']">{{ row['observers'] }}</span>
    </ng-template>
  </ngx-datatable-column>

  <ngx-datatable-column name="Foyer" [sortable]="false">
    <ng-template let-row="row" ngx-datatable-cell-template>
      <ng-container *ngIf="canUpdateCluster">
        <a *ngIf="!row['cluster_id']" class="link-dark" (click)="onAssociate(row['id_synthese'])">
          <i matTooltip="Associer à un foyer" class="fa fa-plus-circle"></i>
        </a>
        <a *ngIf="row['cluster_id'] && getCluster(row['cluster_id'])?.cruved?.U" class="link-dark" (click)="onAssociate(row['id_synthese'])">
          <i matTooltip="Modifier le foyer" class="fa fa-pencil"></i>
        </a>
      </ng-container>
      &nbsp;{{ row['cluster_name'] || getClusterName(row['cluster_id']) }}
    </ng-template>
  </ngx-datatable-column>
</ngx-datatable>
